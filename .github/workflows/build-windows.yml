name: Build Aseprite Windows

on:
  workflow_dispatch:
    inputs:
      aseprite_ref:
        description: "Aseprite branch, tag, or commit"
        required: true
        default: "main"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Clone Aseprite
        shell: pwsh
        run: |
          git clone https://github.com/aseprite/aseprite.git aseprite
          Set-Location aseprite
          git fetch --tags --force
          git checkout "${{ inputs.aseprite_ref }}"
          git submodule update --init --recursive

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y
          }
          ninja --version
          cmake --version

      - name: Download latest Aseprite Skia build
        shell: pwsh
        run: |
          $headers = @{ "Accept" = "application/vnd.github+json"; "User-Agent" = "aseprite-windows-build" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/aseprite/skia/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object { $_.name -eq "Skia-Windows-Release-x64.zip" } | Select-Object -First 1

          if (-not $asset) {
            throw "Skia-Windows-Release-x64.zip was not found in the latest aseprite/skia release."
          }

          Write-Host "Skia release: $($release.tag_name)"
          Write-Host "Downloading: $($asset.browser_download_url)"

          New-Item -ItemType Directory -Force "C:\deps\skia" | Out-Null
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "C:\deps\skia.zip"
          Expand-Archive -Path "C:\deps\skia.zip" -DestinationPath "C:\deps\skia" -Force

          if (-not (Test-Path "C:\deps\skia\out\Release-x64\skia.lib")) {
            Get-ChildItem "C:\deps\skia" -Depth 3 | Select-Object FullName
            throw "Expected Skia library C:\deps\skia\out\Release-x64\skia.lib was not found."
          }

      - name: Configure and build Aseprite
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cd /d "%GITHUB_WORKSPACE%\aseprite"
          mkdir build
          cd build
          cmake -DCMAKE_BUILD_TYPE=RelWithDebInfo -DLAF_BACKEND=skia -DSKIA_DIR=C:\deps\skia -DSKIA_LIBRARY_DIR=C:\deps\skia\out\Release-x64 -DSKIA_LIBRARY=C:\deps\skia\out\Release-x64\skia.lib -G Ninja ..
          ninja aseprite

      - name: Verify build
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "aseprite\build\bin\aseprite.exe"
          if (-not (Test-Path $exe)) {
            throw "Build completed without producing build/bin/aseprite.exe"
          }
          Get-Item $exe | Format-List FullName, Length, LastWriteTime

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows-x64-${{ github.run_number }}
          path: aseprite/build/bin/
          if-no-files-found: error
          retention-days: 7

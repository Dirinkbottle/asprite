name: Validate Linux then Windows

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - name: Linux validation
        run: echo "linux workflow validation ok"

  build-windows:
    needs: build-linux
    runs-on: windows-2022
    steps:
      - name: Windows validation
        shell: pwsh
        run: Write-Host "windows workflow validation ok"
